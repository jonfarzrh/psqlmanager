[project]
name = "psqlmanager"
version = "0.2.1"
description = "Encrypted credential manager and psql wrapper for humans and AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jonfarzanfar", email = "jfarzanfar1@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["postgres", "psql", "credentials", "iam", "rds", "cloud-sql", "cli", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
    "keyring>=24",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/jonfarzrh/psqlmanager"
Repository = "https://github.com/jonfarzrh/psqlmanager"
Issues = "https://github.com/jonfarzrh/psqlmanager/issues"

[project.scripts]
psqlmanager = "psqlmanager.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psqlmanager"]

[tool.hatch.build.targets.sdist]
include = [
    "src/psqlmanager",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
