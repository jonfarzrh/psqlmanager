name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # so release.yml can re-use this job

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # The store and CLI tests use a mocked keyring backend, so they pass
        # cross-platform. Expand to macos-latest / windows-latest here once
        # there's a need; the mocks make it free.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Install (frozen)
        run: uv sync --frozen

      - name: Run pytest
        run: uv run --frozen pytest -ra

  build:
    name: build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distributions
        run: uv build

      - name: Sanity-check the wheel installs
        run: |
          uv venv /tmp/install-check
          uv pip install --python /tmp/install-check/bin/python dist/*.whl
          /tmp/install-check/bin/psqlmanager --version

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
