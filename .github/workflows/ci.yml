name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # so release.yml can re-use this job

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # The store and CLI tests use a mocked keyring backend, so they pass
        # cross-platform. Expand to macos-latest / windows-latest here once
        # there's a need; the mocks make it free.
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # Differentiate the cache per matrix entry so the five parallel
          # jobs don't race to reserve the same key. Each Python version
          # installs different wheels anyway, so per-version caches are
          # the correct granularity.
          cache-suffix: py${{ matrix.python-version }}

      - name: Pin Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Install (frozen)
        run: uv sync --frozen

      - name: Run pytest
        run: uv run --frozen pytest -ra

  security:
    name: security (pip-audit + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: security

      - name: Export runtime requirements
        # `--no-dev` keeps the scope to what ships to users — a CVE in
        # pytest shouldn't block a release. `--no-hashes` matches what
        # pip-audit expects.
        run: uv export --frozen --no-emit-project --no-dev --no-hashes > /tmp/runtime-requirements.txt

      - name: pip-audit  (known CVEs in dependency tree)
        run: uvx pip-audit --requirement /tmp/runtime-requirements.txt --strict

      - name: bandit  (static analysis of src/, medium+ severity)
        run: uvx bandit -r src/ -ll

  build:
    name: build sdist + wheel
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distributions
        run: uv build

      - name: Sanity-check the wheel installs
        run: |
          uv venv /tmp/install-check
          uv pip install --python /tmp/install-check/bin/python dist/*.whl
          /tmp/install-check/bin/psqlmanager --version

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
