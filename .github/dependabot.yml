version: 2
updates:
  # Python runtime + dev dependencies. The `uv` ecosystem reads
  # pyproject.toml AND keeps uv.lock in sync, so Dependabot PRs land
  # already-locked.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Coalesce minor/patch bumps of low-risk libraries into one PR.
      runtime:
        patterns:
          - "click"
          - "typer"
          - "keyring"
          - "cryptography"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions in .github/workflows/*.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
